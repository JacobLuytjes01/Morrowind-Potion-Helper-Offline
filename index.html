<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Morrowind Potion Helper Offline</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --bg: #171717;
        --surface: #242424;
        --text: #e5e5e5;
        --text-muted: #a3a3a3;
        --accent: #b68d40;
        --accent-dark: #8f6d2f;
        --border: #3a3a3a;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f5;
          --surface: #ffffff;
          --text: #1a1a1a;
          --text-muted: #666;
          --accent: #9d6c17;
          --accent-dark: #7b5310;
          --border: #d8d8d8;
        }
      }

      body {
        font-family: Tahoma, Georgia, serif;
        max-width: 2100px;
        margin: 0 auto;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      h1,
      h2 {
        margin-top: 0;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: end;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }

      form > div {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 190px;
        flex: 1;
      }

      label {
        font-weight: 600;
        color: var(--text-muted);
        margin-left: 0.25rem;
      }

      select {
        padding: 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      select:focus {
        outline: 1px solid var(--accent);
        border-color: var(--accent);
      }

      select:hover {
        border-color: rgba(212, 168, 67, 0.35);
        box-shadow: 0 0 16px rgba(212, 168, 67, 0.08);
      }

      button {
        padding: 0.8rem 1.4rem;
        margin: 0.4rem;
        border: none;
        border-radius: 8px;
        background: var(--accent-dark);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(212, 168, 67, 0.25);
      }

      button:hover {
        background: var(--accent);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          transparent,
          rgba(255, 255, 255, 0.15),
          transparent
        );
        transform: translateX(-100%);
        transition: transform 0.5s ease;
      }

      button:hover::before {
        transform: translateX(100%);
      }

      .potionGrid {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .resultCard {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
      }

      .resultCard h1 {
        font-size: 1.4rem;
        color: var(--accent);
        margin-bottom: 1rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
      }

      .resultCard h2 {
        font-size: 1rem;
        margin-top: 1.25rem;
        color: var(--text);
      }

      .ingredientList {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .ingredient {
        padding: 0.35rem 0.8rem;
        font-size: 0.9rem;
      }

      p {
        padding: 0;
        margin: 1.4rem 0 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media (max-width: 720px) {
        body {
          padding: 1rem;
        }

        form > div {
          min-width: 100%;
        }
      }
      @media (max-width: 310px) {
        body {
          padding: 0;
          margin: 0;
        }
        p {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <form id="potionForm">
      <p id="buttonBox">
        <button type="submit" id="sub">Search</button>
        <button type="button" id="add" aria-label="Add effect selector">+</button>
        <button type="button" id="subtract" aria-label="Remove effect selector">−</button>
      </p>
    </form>
    <div id="res" class="potionGrid"></div>
    <script>
      // Data source: https://en.uesp.net/wiki/Morrowind:Alchemy_Effects
      // "Effect Name": ["Ingredient 1", "Ingredient 2", ...]

        "Drain Endurance": ["Bittergreen Petals", "Black Anther", "Bungler's Bane", "Emerald", "Moon Sugar", "Void Salts", "Wolfsbane Petals"],
        "Drain Fatigue": ["Bear Pelt", "Bonemeal", "Comberry", "Corprus Weepings", "Guar Hide", "Hypha Facia", "Kagouti Hide", "Kwama Cuttle", "Large Corprusmeat Hunk", "Large Wrapped Corprusmeat", "Luminous Russula", "Marshmerrow", "Medium Corprusmeat Hunk", "Medium Wrapped Corprusmeat", "Shalk Resin", "Small Corprusmeat Hunk", "Small Wrapped Corprusmeat", "Snow Bear Pelt", "Snow Wolf Pelt", "Spore Pod", "Violet Coprinus", "Wolf Pelt", "Wrapped Corprusmeat Hunk"],
        "Drain Health": ["Coda Flower", "Ectoplasm", "Fire Petal", "Fire Salts", "Gold Kanet", "Gravetar", "Green Lichen", "Horn Lily Bulb", "Large Corprusmeat Hunk", "Large Wrapped Corprusmeat", "Medium Corprusmeat Hunk", "Medium Wrapped Corprusmeat", "Roobrush", "Ruby", "Scathecraw", "Scrap Metal", "Small Corprusmeat Hunk", "Small Wrapped Corprusmeat", "Wrapped Corprusmeat Hunk"],
        "Drain Intelligence": ["Alit Hide", "Coda Flower", "Gravedust", "Human Flesh", "Muck", "Raw Glass", "Scrib Cabbage"],
        "Drain Luck": ["Chokeweed", "Dreugh Wax", "Gold Kanet", "Gravetar", "Hypha Facia", "Moon Sugar", "Stoneflower Petals"],
        "Drain Magicka": ["Belladonna Berries", "Bittergreen Petals", "Bloat", "Golden Sedge Flowers", "Grahl Eyeball", "Gravedust", "Kresh Fiber", "Large Corprusmeat Hunk", "Large Wrapped Corprusmeat", "Medium Corprusmeat Hunk", "Medium Wrapped Corprusmeat", "Rat Meat", "Red Lichen", "Scamp Skin", "Small Corprusmeat Hunk", "Small Wrapped Corprusmeat", "Timsa-Come-By flowers", "Trama Root", "Wolfsbane Petals", "Wrapped Corprusmeat Hunk"],
        "Drain Personality": ["Bonemeal", "Coda Flower", "Heather", "Human Flesh", "Muck", "Netch Leather", "Scales", "Shalk Resin", "Sload Soap", "Willow Anther"],
        "Drain Speed": ["Black Lichen", "Bungler's Bane", "Frost Salts", "Heather", "Kresh Fiber", "Meadow Rye", "Nirthfly Stalks", "Raw Glass", "Red Lichen", "Trama Root"],
        "Drain Strength": ["Black Lichen", "Bungler's Bane", "Ectoplasm", "Green Lichen", "Heartwood", "Raw Glass", "Saltrice", "Scathecraw", "Spore Pod"],
        "Drain Willpower": ["Ampoule Pod", "Chokeweed", "Corprus Weepings", "Dreugh Wax", "Marshmerrow", "Racer Plumes", "Roobrush"],
        "Feather": ["Heather", "Ruby", "Scuttle"],
        "Fire Shield": ["Comberry", "Fire Salts", "Raw Glass", "Sload Soap"],
        "Fortify Agility": ["Durzog Meat", "Ectoplasm", "Fire Salts", "Heartwood", "Noble Sedge Flowers", "Roobrush", "Scrib Cabbage", "Sload Soap"],
        "Fortify Attack": ["Ghoul Heart", "Golden Sedge Flowers"],
        "Fortify Endurance": ["Daedra's Heart", "Guar Hide", "Netch Leather"],
        "Fortify Fatigue": ["Gravetar", "Hound Meat", "Scrib Jerky", "Scuttle"],
        "Fortify Health": ["Human Flesh", "Large Kwama Egg", "Shalk Resin", "Vampire Dust"],
        "Fortify Intelligence": ["Ash Yam", "Bloat", "Horker Tusk", "Netch Leather"],
        "Fortify Luck": ["Corkbulb Root", "Corprus Weepings", "Guar Hide"],
        "Fortify Magicka": ["Belladonna Berries", "Emerald", "Saltrice", "Stoneflower Petals"],
        "Fortify Personality": ["Green Lichen", "Kresh Fiber", "Stoneflower Petals"],
        "Fortify Speed": ["Kagouti Hide", "Meadow Rye", "Moon Sugar", "Nirthfly Stalks", "Shalk Resin", "Snow Bear Pelt", "Snow Wolf Pelt", "Wolf Pelt"],
        "Fortify Strength": ["Ash Yam", "Bear Pelt", "Daedra Skin", "Dreugh Wax", "Durzog Meat", "Golden Sedge Flowers", "Grahl Eyeball", "Vampire Dust"],
        "Fortify Willpower": ["Bloat", "Meteor Slime", "Scrib Jelly", "Wickwheat"],
        "Frost Damage": ["Bristleback Leather", "Holly Berries", "Raw Stalhrim"],
        "Frost Shield": ["Frost Salts", "Holly Berries", "Large Kwama Egg", "Raw Ebony", "Willow Anther"],
        "Invisibility": ["Bittergreen Petals", "Diamond", "Lloramor Spines", "Wolfsbane Petals"],
        "Levitate": ["Coda Flower", "Racer Plumes", "Sweetpulp", "Trama Root"],
        "Light": ["Black Anther", "Red Lichen"],
        "Lightning Shield": ["Corkbulb Root", "Crab Meat", "Scrap Metal"],
        "Night Eye": ["Bear Pelt", "Grahl Eyeball", "Kagouti Hide", "Daedra's Heart", "Snow Bear Pelt", "Snow Wolf Pelt", "Wolf Pelt"],
        "Paralyze": ["Ampoule Pod", "Daedra Skin", "Fire Petal", "Ghoul Heart", "Hackle-Lo Leaf", "Large Kwama Egg", "Rat Meat", "Raw Stalhrim", "Spore Pod", "Sweetpulp", "Void Salts", "Wickwheat"],
        "Poison": ["Adamantium Ore", "Lloramor Spines", "Luminous Russula", "Noble Sedge Flowers", "Violet Coprinus"],
        "Reflect": ["Adamantium Ore", "Comberry", "Diamond", "Hound Meat"],
        "Resist Common Disease": ["Ash Yam", "Bear Pelt", "Kagouti Hide", "Pearl", "Resin", "Snow Bear Pelt", "Snow Wolf Pelt", "Wolf Pelt"],
        "Resist Fire": ["Black Anther", "Fire Petal", "Frost Salts"],
        "Resist Frost": ["Black Lichen", "Bristleback Leather", "Fire Salts", "Grahl Eyeball", "Gravetar", "Holly Berries", "Raw Stalhrim"],
        "Resist Magicka": ["Ash Salts", "Belladonna Berries"],
        "Resist Paralysis": ["Horn Lily Bulb", "Timsa-Come-By flowers", "Sweetpulp"],
        "Resist Poison": ["Alit Hide", "Kwama Cuttle", "Rat Meat"],
        "Resist Shock": ["Crab Meat", "Scrap Metal"],
        "Restore Agility": ["Bonemeal", "Noble Sedge Flowers", "Scrib Cabbage", "Sload Soap"],
        "Restore Endurance": ["Gravedust", "Horn Lily Bulb", "Timsa-Come-By flowers", "Scales"],
        "Restore Fatigue": ["Bread", "Chokeweed", "Crab Meat", "Hackle-Lo Leaf", "Hound Meat", "Large Kwama Egg", "Saltrice", "Scrib Jerky", "Scuttle", "Small Kwama Egg"],
        "Restore Health": ["Corkbulb Root", "Corprus Weepings", "Emerald", "Marshmerrow", "Raw Stalhrim", "Resin", "Saltrice", "Sweetpulp", "Wickwheat"],
        "Restore Intelligence": ["Bittergreen Petals", "Ruby", "Scrap Metal", "Wolfsbane Petals"],
        "Restore Luck": ["Crab Meat", "Hackle-Lo Leaf", "Kresh Fiber"],
        "Restore Magicka": ["Adamantium Ore", "Belladonna Berries", "Comberry", "Daedra's Heart", "Frost Salts", "Heartwood", "Void Salts"],
        "Restore Personality": ["Guar Hide", "Heather", "Scamp Skin"],
        "Restore Speed": ["Meadow Rye", "Nirthfly Stalks", "Raw Ebony", "Resin"],
        "Restore Strength": ["Dreugh Wax", "Gold Kanet", "Horn Lily Bulb", "Scamp Skin", "Stoneflower Petals"],
        "Restore Willpower": ["Meteor Slime", "Scathecraw", "Scrib Jelly", "Trama Root"],
        "Spell Absorption": ["Fire Petal", "Lloramor Spines", "Vampire Dust", "Void Salts"],
        "Swift Swim": ["Daedra Skin", "Golden Sedge Flowers", "Scales", "Scrib Jerky"],
        "Telekinesis": ["Alit Hide", "Bonemeal", "Scuttle"],
        "Water Breathing": ["Hackle-Lo Leaf", "Kwama Cuttle", "Luminous Russula", "Pearl"],
        "Water Walking": ["Ampoule Pod", "Kwama Cuttle", "Scales", "Violet Coprinus"],
        "Weakness to Fire": ["Heartwood", "Holly Berries"],
    }

      const selectionIds = ["I1", "I2", "I3", "I4"];
      const potionForm = document.getElementById("potionForm");
      const buttons = document.getElementById("buttonBox");

      function addSelecter(id) {
        const main = document.createElement("div");
        const lab = document.createElement("label");
        const sel = document.createElement("select");
        lab.setAttribute("for", id);
        sel.id = id;
        lab.textContent = `Effect ${id.substring(1)}:`;
        sel.setAttribute("name", id);

        Object.keys(potions).forEach((effect) => {
          const option = document.createElement("option");
          option.value = effect;
          option.textContent = effect;
          sel.appendChild(option);
        });
        main.id = "m" + id;
        main.appendChild(lab);
        main.appendChild(sel);
        potionForm.insertBefore(main, buttons);
      }

      function createSelecter() {
        const newId = `I${selectionIds.length + 1}`;
        selectionIds.push(newId);
        addSelecter(newId);
      }

      selectionIds.forEach((id) => {
        addSelecter(id);
      });

      document.getElementById("add").addEventListener("click", createSelecter);
      document.getElementById("subtract").addEventListener("click", () => {
        if (selectionIds.length > 1) {
          document.getElementById(`m${selectionIds.pop()}`).remove();
        }
      });

      document.getElementById("potionForm").addEventListener("submit", function (event) {
          event.preventDefault();
          const input = [];
          selectionIds.forEach((id) => {
            const val = document.getElementById(id).value;
            if (val !== "Select an Effect" && !input.includes(val)) {
              input.push(val);
            }
          });

          if (input.length > 0) {
            const possibleItems = new Set();
            const itemlevels = new Array(input.length).fill(null).map(() => ({}));

            input.forEach((effect) => {
              potions[effect].forEach((ingredient) => {
                possibleItems.add(ingredient);
              });
            });
            possibleItems.forEach((item) => {
              let key = [];
              let level = input.length;
              input.forEach((effect) => {
                if (potions[effect].includes(item)) {
                  key.push(effect);
                  level--;
                }
              });
              key = key.join(" + ");
              itemlevels[level][key] === undefined ? (itemlevels[level][key] = [item]) : itemlevels[level][key].push(item);
            });

            const output = document.getElementById("res");
            output.innerHTML = "";
            itemlevels.forEach((cat, index) => {
              if (Object.keys(cat).length === 0) {
                return;
              }
              const resultCard = document.createElement("div");
              resultCard.className = "resultCard";
              const mainHeading = document.createElement("h1");
              mainHeading.textContent = `Items Matching ${index === 0 && input.length !== 1 ? "All" : input.length - index} Effect${input.length - index !== 1 ? "s" : ""}`;
              resultCard.appendChild(mainHeading);

              Object.entries(cat).forEach(([effects, items]) => {
                const innerHeading = document.createElement("h2");
                innerHeading.textContent = effects;
                const ingredientList = document.createElement("div");
                ingredientList.className = "ingredientList";

                items.forEach((item) => {
                  const itemDiv = document.createElement("div");
                  itemDiv.className = "ingredient";
                  itemDiv.textContent = item;
                  ingredientList.appendChild(itemDiv);
                });
                resultCard.appendChild(innerHeading);
                resultCard.appendChild(ingredientList);
              });
              output.appendChild(resultCard);
            });
          } else {
            document.getElementById("res").innerHTML = "";
          }
        });
    </script>
  </body>
</html>
